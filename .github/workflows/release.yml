name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        type: choice
        required: true
        default: draft
        options:
          - draft
          - public
      bump:
        description: Version increment
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

# Queue runs so two releases can never pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The self-test test builds the Tk window, so the tests need the app installed and a display.
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install the app and test requirements
        run: python -m pip install . "pytest>=7"

      - name: Run tests
        run: xvfb-run -a python -m pytest

  version:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Draft releases are only visible with write access.
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out next version
        id: next
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          tag=$(
            {
              git tag --list
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name'
            } | bash .github/scripts/next_version.sh "$BUMP"
          )
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building $tag as a $RELEASE_TYPE release ($BUMP)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            mode: --onefile
            icon: assets/icon/klippings.ico
          - os: macos-latest
            target: macos-arm64
            mode: --onedir # PyInstaller is dropping --onefile for macOS app bundles.
            icon: assets/icon/klippings.icns
          - os: ubuntu-24.04
            target: linux-x64
            mode: --onefile
            icon: assets/icon/klippings.png
    env:
      TAG: ${{ needs.version.outputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk xvfb

      - name: Confirm Apple Silicon (macOS)
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Add version to the app
        shell: bash
        run: echo "__version__ = \"${TAG#v}\"" > klippings/_version.py

      - name: Install dependencies
        run: python -m pip install . pyinstaller pillow

      - name: Check Tk is available
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build
        shell: bash
        run: >
          pyinstaller --noconfirm ${{ matrix.mode }} --windowed
          --name Klippings --paths .
          --osx-bundle-identifier io.github.tariqmk.klippings
          --collect-data customtkinter --collect-all tkinterdnd2
          --icon "${{ matrix.icon }}"
          --add-data "assets/icon/klippings.ico:assets/icon"
          --add-data "assets/icon/klippings.png:assets/icon"
          --add-data "klippings/fonts:klippings/fonts"
          klippings/__main__.py

      # PyInstaller leaves the version in Get Info at 0.0.0. PyInstaller's Info.plist has no
      # CFBundleVersion, and PlistBuddy's "Set" fails on a missing key, so use plutil -replace,
      # which adds it. Editing Info.plist breaks the ad-hoc signature, so sign again.
      - name: Stamp the version and check the icon (macOS)
        if: runner.os == 'macOS'
        run: |
          app=dist/Klippings.app
          plist="$app/Contents/Info.plist"
          v="${TAG#v}"; v="${v%%-*}"
          plutil -replace CFBundleShortVersionString -string "$v" "$plist"
          plutil -replace CFBundleVersion -string "$v" "$plist"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          ls "$app/Contents/Resources/"*.icns >/dev/null || { echo "::error::The .app has no icon"; exit 1; }

      # Starts the real build. It proves the window, icons, fonts, themes and drag and drop load,
      # and that the version is right. A windowed .exe has no console, so Windows checks the exit code only.
      - name: Self-test (macOS, Linux)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) output=$(dist/Klippings.app/Contents/MacOS/Klippings --self-test) ;;
            Linux) output=$(xvfb-run -a dist/Klippings --self-test) ;;
          esac
          echo "$output"
          [ "$(tail -n 1 <<< "$output")" = "Klippings $TAG" ] || { echo "::error::Expected 'Klippings $TAG'"; exit 1; }

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process "dist/Klippings.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Package
        shell: bash
        run: |
          mkdir out
          name="Klippings-$TAG-$TARGET"
          case "$RUNNER_OS" in
            Windows) cp dist/Klippings.exe "out/$name.exe" ;;
            macOS) ditto -c -k --keepParent dist/Klippings.app "out/$name.zip" ;;
            Linux) tar -czf "out/$name.tar.gz" -C dist Klippings ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      RELEASE_TYPE: ${{ inputs.release_type }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create tag
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

      - name: Create release
        run: |
          flags=()
          if [ "$RELEASE_TYPE" = draft ]; then
            flags+=(--draft)
          fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Klippings $TAG" \
            --generate-notes \
            "${flags[@]}"
